template:
  name: Kyriba Approval Rejected Email
  identifier: KyribaApprovalRejectedEmail
  versionLabel: v1
  type: Notification
  projectIdentifier: Kyriba
  orgIdentifier: default
  description: Promotion REJECTED email. Attach to a StageFailed rule scoped to the approval stage. Outcome is hardcoded - the rule's event already determines the outcome, so no ternary on notification.eventType is needed. Colours use rgb() not hex, because a space before a hash starts a YAML comment and silently truncates the body.
  tags: {}
  spec:
    body:
      type: STRING
      content: |-
        subject: Promotion REJECTED - <+pipeline.variables.serviceName> <+pipeline.variables.promotedVersion> to <+pipeline.variables.targetEnv>
        body: <div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:620px;margin:0 auto;border:1px solid rgb(208,215,222);border-radius:10px;overflow:hidden"><div style="background:rgb(207,34,46);color:rgb(255,255,255);padding:16px 20px;font-size:17px;font-weight:600">Promotion REJECTED</div><div style="padding:20px 20px 8px 20px"><div style="font-size:15px;color:rgb(36,41,47);line-height:1.5;margin-bottom:18px">Version <b><+pipeline.variables.promotedVersion></b> of <b><+pipeline.variables.serviceName></b> was NOT promoted to <b><+pipeline.variables.targetEnv></b>.</div><table style="width:100%;border-collapse:collapse;font-size:14px"><tr><td style="padding:8px 0;color:rgb(87,96,106);width:40%">Promoted version</td><td style="padding:8px 0;color:rgb(36,41,47);font-weight:600"><+pipeline.variables.promotedVersion></td></tr><tr><td style="padding:8px 0;color:rgb(87,96,106)">Service</td><td style="padding:8px 0;color:rgb(36,41,47);font-weight:600"><+pipeline.variables.serviceName></td></tr><tr><td style="padding:8px 0;color:rgb(87,96,106)">Target environment</td><td style="padding:8px 0;color:rgb(36,41,47);font-weight:600"><+pipeline.variables.targetEnv></td></tr><tr><td style="padding:8px 0;color:rgb(87,96,106)">Decision</td><td style="padding:8px 0;color:rgb(207,34,46);font-weight:600">REJECTED</td></tr><tr><td style="padding:8px 0;color:rgb(87,96,106)">Rejected by</td><td style="padding:8px 0;color:rgb(36,41,47)"><+pipeline.stages.promotion_approval.spec.execution.steps.approve_promotion.output.approvalActivities[0].user.name></td></tr><tr><td style="padding:8px 0;color:rgb(87,96,106)">Comments</td><td style="padding:8px 0;color:rgb(36,41,47)"><+pipeline.stages.promotion_approval.spec.execution.steps.approve_promotion.output.approvalActivities[0].comments></td></tr><tr><td style="padding:8px 0;color:rgb(87,96,106)">Pipeline</td><td style="padding:8px 0;color:rgb(36,41,47)"><+pipeline.name></td></tr><tr><td style="padding:8px 0;color:rgb(87,96,106)">Build</td><td style="padding:8px 0;color:rgb(36,41,47)"><+pipeline.sequenceId></td></tr><tr><td style="padding:8px 0;color:rgb(87,96,106)">Triggered by</td><td style="padding:8px 0;color:rgb(36,41,47)"><+pipeline.triggeredBy.email></td></tr><tr><td style="padding:8px 0;color:rgb(87,96,106)">Raw event value</td><td style="padding:8px 0;color:rgb(36,41,47)"><+notification.eventType></td></tr></table></div><div style="padding:4px 20px 16px 20px"><a href="<+pipeline.execution.url>" style="display:inline-block;background:rgb(9,105,218);color:rgb(255,255,255);text-decoration:none;padding:10px 20px;border-radius:6px;font-weight:600;font-size:14px">View execution</a></div><div style="padding:0 20px 20px 20px;font-size:12px;color:rgb(87,96,106);word-break:break-all">Execution URL <+pipeline.execution.url></div><div style="background:rgb(246,248,250);border-top:1px solid rgb(208,215,222);padding:12px 20px;font-size:12px;color:rgb(87,96,106)">Sent by Harness - custom notification template KyribaApprovalRejectedEmail v1</div></div>
